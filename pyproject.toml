[project]
name = "janus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Laksh Patel", email = "laksh270406@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "fastembed>=0.7.4",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.10.0",
    "prometheus-client>=0.20.0",
    "pytest>=9.2.0",
    "pytest-dotenv>=0.5.2",
    "redis>=5.0.0",
]

[project.optional-dependencies]
loadtest = [
    "locust>=2.29.0",
]

[project.scripts]
janus = "janus:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "janus.main:app"

[tool.pytest.ini_options]
env_files = [".env"]
